[package]
name = "serde_json_lodash"
version = "0.3.0"
authors = ["up9cloud <8325632+up9cloud@users.noreply.github.com>"]
description = "lodash.js ported version, work with serde_json::Value"
keywords = ["serde", "serde_json", "json", "lodash"]
license = "MIT"
edition = "2024"
readme = "README.md"
repository = "https://github.com/up9cloud/serde_json_lodash"
homepage = "https://github.com/up9cloud/serde_json_lodash"
documentation = "https://docs.rs/serde_json_lodash"

[features]
default = []
all = ["camel", "lazy_static"]
alias = ["dep:paste"]
camel = ["alias"]

[dependencies]
serde_json = "1"
paste = { version = "1", optional = true }
lazy_static = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.3"

[lib]
bench = false

[[bench]]
name = "criterion"
harness = false
