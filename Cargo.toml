[package]
name = "serde_json_lodash"
version = "0.2.0"
authors = ["up9cloud <8325632+up9cloud@users.noreply.github.com>"]
description = "lodash.js ported version, work with serde_json::Value"
keywords = ["serde", "serde_json", "json", "lodash"]
license = "MIT"
edition = "2024"

[features]
default = ["camel"]
all = ["camel", "lazy_static"]
# `alias` enables the `paste`-based aliasing machinery (`build_link!` /
# `build_camel_link!`) and the snake_case lodash aliases (`first`, `entries`,
# `has_in`, …). Without it those names are unavailable (use the canonical name).
alias = ["dep:paste"]
# camelCase aliases (`isEmpty`, `hasIn`, …) require the aliasing machinery.
camel = ["alias"]

[dependencies]
serde_json = "1"
paste = { version = "1", optional = true }
lazy_static = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.3"

[lib]
bench = false

[[bench]]
name = "criterion"
harness = false
